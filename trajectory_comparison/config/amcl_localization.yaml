amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.30
    laser_max_range: 40.0
    max_beams: 90
    min_particles: 1000
    max_particles: 5000
    pf_err: 0.03
    pf_z: 0.99
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    sigma_hit: 0.20
    lambda_short: 0.10
    z_hit: 0.70
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.20
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    always_reset_initial_pose: true
