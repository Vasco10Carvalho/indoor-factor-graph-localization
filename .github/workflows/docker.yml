name: Docker validation

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS 2 Humble image
        run: docker build --tag indoor-factor-graph-localization:humble .
      - name: Run tests
        run: ./pipeline.sh check
